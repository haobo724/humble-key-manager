[project]
name = "humble-key-manager"
version = "0.3.0b1"
description = "Local Humble Bundle key manager with Choice claiming, Steam library matching and explicit activation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "haobo724" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.45.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=10.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
humble-bundle-keys = "humble_bundle_keys.cli:main"
humble-bundle-keys-web = "humble_bundle_keys.web:main"

[project.urls]
Homepage = "https://github.com/haobo724/humble-key-manager"
Repository = "https://github.com/haobo724/humble-key-manager"
Issues = "https://github.com/haobo724/humble-key-manager/issues"
Upstream = "https://github.com/gfargo/humble-bundle-keys"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humble_bundle_keys"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that need a real Humble account (skipped by default)",
]
